<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aprèn jugant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: one centred play column like a school worksheet card; subject colour bands, the class maps and three answer colours carry the identity. */
:root{
  --bg:#EEF4F8; --surface:#FFFFFF; --ink:#15314A; --muted:#566C80; --line:#D3DFE8;
  --river:#1D63C4; --good:#23804E; --good-bg:#DDF3E6; --bad:#B9440F; --bad-bg:#FCE6DA;
  --c1:#F7C9CE; --c1-ink:#6E1A26; --c2:#D2E8C5; --c2-ink:#1F5219; --c3:#F8EDA6; --c3-ink:#5E4900;
  --map-bg:#EEF5FA; --badge:#1B3A57; --btn:#1D63C4; --btn-ink:#FFFFFF;
  --geo:#1D63C4; --geo-bg:#DCEAF8; --ana:#C2364B; --ana-bg:#F9DEE2;
  --f-display:"Rubik", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1B27; --surface:#162736; --ink:#E5EEF6; --muted:#9BB0C3; --line:#2A4054;
  --river:#7AB0F7; --good:#62CC90; --good-bg:#173A29; --bad:#F39468; --bad-bg:#43251A;
  --c1:#59303A; --c1-ink:#FFDCE0; --c2:#2D4A2B; --c2-ink:#DAF3CF; --c3:#544A1E; --c3-ink:#FFF0B0;
  --badge:#9CC3EA; --btn:#2F72CC; --btn-ink:#FFFFFF;
  --geo:#7AB0F7; --geo-bg:#1B3550; --ana:#F28A9B; --ana-bg:#4A2129; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1B27; --surface:#162736; --ink:#E5EEF6; --muted:#9BB0C3; --line:#2A4054;
  --river:#7AB0F7; --good:#62CC90; --good-bg:#173A29; --bad:#F39468; --bad-bg:#43251A;
  --c1:#59303A; --c1-ink:#FFDCE0; --c2:#2D4A2B; --c2-ink:#DAF3CF; --c3:#544A1E; --c3-ink:#FFF0B0;
  --badge:#9CC3EA; --btn:#2F72CC; --btn-ink:#FFFFFF;
  --geo:#7AB0F7; --geo-bg:#1B3550; --ana:#F28A9B; --ana-bg:#4A2129; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.app{max-width:640px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:18px}
/* Wallpaper on every screen: cats.webp, the file next to index.html. Always light so text stays readable on it. */
body.wall{
  --bg:#FBEBDD; --surface:#FFFFFF; --ink:#15314A; --muted:#566C80; --line:#E6D3C3;
  --river:#1D63C4; --good:#23804E; --good-bg:#DDF3E6; --bad:#B9440F; --bad-bg:#FCE6DA;
  --c1:#F7C9CE; --c1-ink:#6E1A26; --c2:#D2E8C5; --c2-ink:#1F5219; --c3:#F8EDA6; --c3-ink:#5E4900;
  --badge:#1B3A57; --btn:#1D63C4; --btn-ink:#FFFFFF; --ana:#C2364B; --ana-bg:#F9DEE2; --geo:#1D63C4; --geo-bg:#DCEAF8; --map-bg:#EEF5FA; color-scheme:light;
  background:linear-gradient(rgba(255,255,255,.45), rgba(255,255,255,.45)), url("cats.webp") center / cover fixed, #FBEBDD}
body.wall header, body.wall .crumbs{background:rgba(255,255,255,.88);border-radius:14px;padding:8px 12px;width:fit-content;max-width:100%}
body.wall .card{box-shadow:0 8px 24px rgba(90,50,20,.18)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--river);outline-offset:2px}

header{display:flex;align-items:center;gap:10px;min-width:0}
header svg{flex:none}
h1{font-family:var(--f-display);font-weight:700;font-size:1.6rem;line-height:1.1;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.92rem;margin:2px 0 0}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--muted);font-size:.9rem}
.crumbs button{background:none;border:none;padding:2px 0;color:var(--river);font-weight:700;text-decoration:underline;text-underline-offset:3px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px}
.lead{font-size:1.05rem;margin:0}
.ua{color:var(--muted);font-size:.92rem}
h2{font-family:var(--f-display);font-size:1.35rem;margin:0;text-wrap:balance}

.subjects{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.subject{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;border:2px solid transparent;border-radius:18px;padding:18px;min-height:150px;transition:transform .15s}
.subject:hover{transform:translateY(-2px)}
.subject.geo{background:var(--geo-bg)} .subject.geo:hover{border-color:var(--geo)}
.subject.ana{background:var(--ana-bg)} .subject.ana:hover{border-color:var(--ana)}
.subject svg{width:44px;height:44px}
.subject .t{font-family:var(--f-display);font-weight:700;font-size:1.3rem;display:block}
.subject .d{color:var(--muted);font-size:.9rem;display:block}

.list{display:grid;gap:12px}
.item{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;text-align:left;
  background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;transition:border-color .15s}
.item:hover{border-color:var(--river)}
.item .num{width:40px;height:40px;border-radius:50%;background:var(--badge);color:var(--surface);
  display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.item .t{font-family:var(--f-display);font-weight:700;font-size:1.1rem;display:block}
.item .d{color:var(--muted);font-size:.9rem;display:block}
.item .meta{color:var(--muted);font-size:.85rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.stars{display:flex;gap:2px;flex:none}
.stars svg{width:20px;height:20px}
.star-on{fill:#E8A817}
.star-off{fill:var(--line)}

.topbar{display:flex;align-items:center;gap:12px}
.ghost{background:none;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.92rem}
.ghost:hover{border-color:var(--river)}
.progress{flex:1;height:12px;background:var(--line);border-radius:999px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--river);border-radius:999px;transition:width .3s}
.count{font-variant-numeric:tabular-nums;font-weight:800;font-size:.95rem;color:var(--muted);min-width:3.5em;text-align:right}

.prompt{font-family:var(--f-display);font-weight:500;font-size:1.05rem;color:var(--muted);margin:0}
.big{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;text-align:center}
.big .word{font-family:var(--f-display);font-weight:700;font-size:2.2rem;line-height:1.1;color:var(--river)}
.big .def{font-size:1.25rem;font-weight:600;line-height:1.35;max-width:32ch}
.speak{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);display:grid;place-items:center;flex:none}
.speak svg{width:20px;height:20px;fill:var(--river)}
.hintrow{display:flex;justify-content:center}
.hint{background:none;border:none;color:var(--river);font-weight:700;font-size:.92rem;text-decoration:underline;text-underline-offset:3px;padding:4px}
.uabox{background:var(--bg);border-radius:12px;padding:10px 14px;text-align:center;color:var(--ink);font-size:.98rem}

.choices{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
.choices.n3{grid-template-columns:repeat(3,1fr)}
.opt{border:2px solid transparent;border-radius:14px;padding:14px 10px;font-weight:800;font-size:1.02rem;min-height:62px;
  background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .12s;text-align:center}
.opt:hover:not(:disabled){transform:translateY(-2px)}
.opt:disabled{cursor:default}
.opt small{font-weight:600;font-size:.78rem;opacity:.85}
.opt.c1{background:var(--c1);color:var(--c1-ink)}
.opt.c2{background:var(--c2);color:var(--c2-ink)}
.opt.c3{background:var(--c3);color:var(--c3-ink)}
.opt.yes{background:var(--good-bg);color:var(--good);min-height:72px;font-size:1.2rem}
.opt.no{background:var(--bad-bg);color:var(--bad);min-height:72px;font-size:1.2rem}
.opt.right{border-color:var(--good);box-shadow:0 0 0 3px var(--good-bg)}
.opt.wrong{border-color:var(--bad);opacity:.75}
.opt.fade{opacity:.45}

.map{position:relative;background:var(--map-bg);border-radius:14px;overflow:hidden;max-width:100%}
.map img{display:block;width:100%;height:auto}
.marker{position:absolute;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  border:4px solid #E4572E;box-shadow:0 0 0 3px rgba(255,255,255,.85);pointer-events:none}
.marker::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:4px solid #E4572E;animation:pulse 1.4s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(1.8);opacity:0}}
.tag{position:absolute;transform:translate(-50%,-160%);background:#15314A;color:#fff;font-weight:800;font-size:.88rem;
  padding:4px 10px;border-radius:999px;white-space:nowrap;pointer-events:none}

.order-done{display:grid;gap:8px;margin:0;padding:0;list-style:none;counter-reset:step}
.order-done li{display:flex;align-items:center;gap:10px;background:var(--good-bg);color:var(--ink);border-radius:12px;padding:10px 12px;font-weight:700}
.order-done li::before{counter-increment:step;content:counter(step);flex:none;width:28px;height:28px;border-radius:50%;background:var(--good);color:var(--surface);display:grid;place-items:center;font-weight:800;font-size:.9rem}
.order-done li small{display:block;font-weight:600;color:var(--muted)}
.order-done .slot{background:var(--bg);border:2px dashed var(--line);color:var(--muted);font-weight:600}
.order-done .slot::before{background:var(--line);color:var(--muted)}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:800;font-size:1rem;text-align:center;max-width:100%;transition:transform .12s}
.tile:hover{border-color:var(--river);transform:translateY(-2px)}
.tile small{display:block;font-weight:600;font-size:.78rem;color:var(--muted)}
.tile.shake{border-color:var(--bad);background:var(--bad-bg);animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.feedback{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.feedback.ok{background:var(--good-bg)}
.feedback.no{background:var(--bad-bg)}
.feedback b.h{font-family:var(--f-display);font-size:1.1rem}
.feedback.ok b.h{color:var(--good)}
.feedback.no b.h{color:var(--bad)}
.next{align-self:stretch;background:var(--btn);color:var(--btn-ink);border:none;border-radius:14px;padding:14px;font-weight:800;font-size:1.05rem}

.result{align-items:center;text-align:center}
.result .stars svg{width:52px;height:52px;animation:pop .4s ease-out both}
.result .stars svg:nth-child(2){animation-delay:.15s}
.result .stars svg:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
.row .next{flex:1 1 180px}
.row .ghost{flex:1 1 140px;padding:13px}
.foot{color:var(--muted);font-size:.85rem;text-align:center;margin:0}

@media (max-width:440px){
  .choices.n3{grid-template-columns:1fr}
  .subjects{grid-template-columns:1fr}
  .subject{min-height:0}
  .big .word{font-size:1.8rem}
  h1{font-size:1.35rem}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>

    ["La sang agafa oxigen al cor.","Кров отримує кисень у серці.",0,"L’agafa als pulmons.","Вона отримує його в легенях."],
    ["Les artèries porten la sang des del cor.","Артерії несуть кров від серця.",1,"Les venes la retornen al cor.","Вени повертають її до серця."],
    ["Les venes porten la sang des del cor.","Вени несуть кров від серця.",0,"Les venes retornen la sang al cor.","Вени повертають кров до серця."],
    ["La sang rica en oxigen arriba al costat esquerre del cor.","Кров, багата на кисень, надходить у ліву частину серця.",1,"Després el cor l’envia a tot el cos.","Потім серце посилає її до всього тіла."],
    ["La circulació menor porta la sang a les cames.","Мале коло несе кров до ніг.",0,"Va del cor als pulmons i torna al cor.","Воно йде від серця до легень і назад."],
    ["Als pulmons, la sang deixa diòxid de carboni.","У легенях кров віддає вуглекислий газ.",1,"I agafa oxigen.","І отримує кисень."],
    ["Sense oxigen, les cèl·lules treballen millor.","Без кисню клітини працюють краще.",0,"Sense oxigen, les cèl·lules no poden treballar bé.","Без кисню клітини не можуть добре працювати."],
    ["Els capil·lars són vasos molt petits.","Капіляри: дуже дрібні судини.",1,"Allà hi ha l’intercanvi de gasos i substàncies.","Там відбувається обмін газів і речовин."]
  ].map(([s,su,a,e,eu]) => ({s,su,a:!!a,e,eu}))}
]};

const SUBJECTS = [
  {id:"geo", t:"Geografia", tua:"Географія", cls:"geo", lessons:[L_PEN, L_REL, L_COST, L_RIUS]},
  {id:"ana", t:"Anatomia", tua:"Анатомія", cls:"ana", lessons:[L_URI, L_CIRC]}
];
L_REL.rounds[0].items.forEach(it => it.map = it.m);   // relief map round uses two maps

/* ======================= helpers ======================= */
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let best = store.get("apren-best") || {};
const $screen = document.getElementById("screen");
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const STAR = on => `<svg viewBox="0 0 24 24" aria-hidden="true"><path class="${on?"star-on":"star-off"}" d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>`;
const starsHtml = n => `<span class="stars" aria-label="${n} de 3 estrelles">${STAR(n>=1)}${STAR(n>=2)}${STAR(n>=3)}</span>`;
const canSpeak = "speechSynthesis" in window;
const SPEAK = t => canSpeak ? `<button class="speak" data-say="${esc(t)}" aria-label="Escolta"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button>` : "";
function say(text){
  if(!canSpeak) return;
  try{
    const u = new SpeechSynthesisUtterance(text);
    const voices = speechSynthesis.getVoices();
    const v = voices.find(x => /^ca/i.test(x.lang)) || voices.find(x => /^es/i.test(x.lang));
    u.lang = v ? v.lang : "ca-ES"; if(v) u.voice = v; u.rate = 0.85;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}
document.addEventListener("click", e => { const b = e.target.closest("[data-say]"); if(b){ e.stopPropagation(); say(b.dataset.say); } });
const ICON = {
  geo:`<svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="20" fill="var(--geo)"/><path d="M8 18c6-2 8 3 13 1s5-7 11-5M7 28c7 0 9-4 15-2s8 4 15 1" stroke="var(--surface)" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>`,
  ana:`<svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="20" fill="var(--ana)"/><path d="M22 33s-10-6-10-13a5.5 5.5 0 0 1 10-3 5.5 5.5 0 0 1 10 3c0 7-10 13-10 13z" fill="var(--surface)"/></svg>`
};
const key = (l, r) => `${l.id}.${r.id}`;
const lessonStars = l => l.rounds.reduce((s, r) => s + (best[key(l, r)] || 0), 0);

/* ======================= navigation ======================= */
let NAV = {s:null, l:null};
const wall = () => document.body.classList.add("wall");
function home(){
  NAV = {s:null, l:null}; wall(null);
  $screen.innerHTML = `
  <div class="card">
    <p class="lead">Tria una assignatura. Si t’equivoques, la pregunta torna a sortir més tard.</p>
    <p class="ua" style="margin:0">Обери предмет. Якщо помилишся, питання повернеться пізніше.</p>
    <div class="subjects">
      ${SUBJECTS.map((s,i) => {
        const total = s.lessons.reduce((n,l) => n + l.rounds.length * 3, 0), got = s.lessons.reduce((n,l) => n + lessonStars(l), 0);
        return `<button class="subject ${s.cls}" data-s="${i}">${ICON[s.cls]}<span><span class="t">${s.t}</span><span class="d">${s.tua} · ${s.lessons.length} lliçons · ★ ${got}/${total}</span></span></button>`;
      }).join("")}
    </div>
  </div>`;
  $screen.querySelectorAll("[data-s]").forEach(b => b.onclick = () => subject(+b.dataset.s));
}
function crumbs(parts){
  return `<div class="crumbs">${parts.map((p,i) => p.go ? `<button data-crumb="${i}">${p.t}</button>` : `<span>${p.t}</span>`).join(" <span>›</span> ")}</div>`;
}
function wireCrumbs(parts){ $screen.querySelectorAll("[data-crumb]").forEach(b => b.onclick = parts[+b.dataset.crumb].go); }
function subject(si){
  NAV = {s:si, l:null}; wall(null);
  const s = SUBJECTS[si];
  const parts = [{t:"Inici", go:home}, {t:s.t}];
  $screen.innerHTML = `
  ${crumbs(parts)}
  <div class="card">
    <h2>${s.t} <span class="ua">· ${s.tua}</span></h2>
    <div class="list">
      ${s.lessons.map((l,i) => `
      <button class="item" data-l="${i}">
        <span class="num">${i+1}</span>
        <span><span class="t">${l.t}</span><span class="d">${l.tua}${l.date ? " · " + l.date : ""} · ${l.rounds.length} jocs</span></span>
        <span class="meta">★ ${lessonStars(l)}/${l.rounds.length * 3}</span>
      </button>`).join("")}
    </div>
  </div>`;
  wireCrumbs(parts);
  $screen.querySelectorAll("[data-l]").forEach(b => b.onclick = () => lesson(si, +b.dataset.l));
}
function lesson(si, li){
  NAV = {s:si, l:li};
  const s = SUBJECTS[si], l = s.lessons[li]; wall(l);
  const parts = [{t:"Inici", go:home}, {t:s.t, go:() => subject(si)}, {t:l.t}];
  $screen.innerHTML = `
  ${crumbs(parts)}
  <div class="card">
    <h2>${l.t} <span class="ua">· ${l.tua}</span></h2>
    <div class="list">
      ${l.rounds.map((r,i) => `
      <button class="item" data-r="${i}">
        <span class="num">${i+1}</span>
        <span><span class="t">${r.t}</span><span class="d">${r.tua} · ${r.items.length} ${r.type === "order" ? "reptes" : "preguntes"}</span></span>
        ${starsHtml(best[key(l, r)] || 0)}
      </button>`).join("")}
    </div>
  </div>`;
  wireCrumbs(parts);
  $screen.querySelectorAll("[data-r]").forEach(b => b.onclick = () => start(si, li, +b.dataset.r));
}

/* ======================= game ======================= */
let G = null;
function start(si, li, ri){
  const l = SUBJECTS[si].lessons[li], r = l.rounds[ri]; wall(l);
  const items = shuffle(r.items);
  G = {si, li, ri, l, r, queue: items, total: items.length, done: 0, mistakes: 0, missed: new Set(), answered: false, showUa: false};
  next();
}
function next(){
  if(!G.queue.length) return result();
  G.current = G.queue[0]; G.answered = false; G.showUa = false; G.opts = null; G.picked = null;
  G.got = []; G.tiles = null; G.slipped = false; G.shake = null;
  draw();
}
const label = it => it.ca || it.a || it.q || it.s;
function optionsFor(it){
  const r = G.r;
  if(r.type === "sort") return r.cats.map(c => c.k);
  if(r.type === "tf") return ["true","false"];
  const field = r.type === "pick" ? "a" : "ca";
  const pool = shuffle([...new Map(r.items.filter(x => x[field] !== it[field]).map(x => [x[field], x])).values()]).slice(0,3);
  return shuffle([it, ...pool]);
}
function correctKey(it){
  const t = G.r.type;
  return t === "sort" ? it.c : t === "tf" ? String(it.a) : t === "pick" ? it.a : it.ca;
}
function body(){
  const it = G.current, r = G.r, ua = G.showUa;
  if(r.type === "sort"){
    const promptUa = r.catWord ? `${r.qu} <b>${esc(it.ua)}</b>?` : `${r.qu}<br><b>${esc(it.ua)}</b>`;
    return `<p class="prompt">${r.q}</p>
      <div class="big">${it.long ? `<span class="def">${esc(it.ca)}</span>` : `<span class="word">${esc(it.ca)}</span>`}${SPEAK(it.ca)}</div>
      ${ua ? `<div class="uabox">${promptUa}</div>` : ""}
      <div class="choices ${r.cats.length === 3 ? "n3" : ""}">${G.opts.map(k => { const c = r.cats.find(x => x.k === k); return `<button class="opt ${c.cls}" data-a="${k}">${c.ca}${ua ? `<small>${c.ua}</small>` : ""}</button>`; }).join("")}</div>`;
  }
  if(r.type === "map"){
    const m = MAPS[it.map || r.map];
    const lx = (it.x / m.w * 100).toFixed(2), ly = (it.y / m.h * 100).toFixed(2);
    const q = r.numbered ? `Què és el número <b>${it.n}</b>?` : r.q;
    const qu = r.numbered ? `Що під номером <b>${it.n}</b>?` : r.qu;
    return `<p class="prompt">${q}</p>
      <div class="map"><img src="${m.src}" alt="Mapa" draggable="false">
        <span class="marker" style="left:${lx}%;top:${ly}%;width:${m.size}%"></span>
        ${G.answered ? `<span class="tag" style="left:${lx}%;top:${ly}%">${r.numbered ? it.n + " · " : ""}${esc(it.ca)}</span>` : ""}
      </div>
      ${ua ? `<div class="uabox">${qu}</div>` : ""}
      <div class="choices">${G.opts.map(o => `<button class="opt" data-a="${esc(o.ca)}">${esc(o.ca)}${ua ? `<small>${esc(o.ua)}</small>` : ""}</button>`).join("")}</div>`;
  }
  if(r.type === "pick"){
    return `<p class="prompt">${r.q}</p>
      <div class="big">${it.big ? `<span class="word">${esc(it.q)}</span>` : `<span class="def">${esc(it.q)}</span>`}${SPEAK(it.q)}</div>
      ${ua ? `<div class="uabox">${r.qu} ${esc(it.qu)}</div>` : ""}
      <div class="choices">${G.opts.map(o => `<button class="opt" data-a="${esc(o.a)}">${esc(o.a)}${ua ? `<small>${esc(o.au)}</small>` : ""}</button>`).join("")}</div>`;
  }
  if(r.type === "tf"){
    return `<p class="prompt">Cert o fals?</p>
      <div class="big"><span class="def">${esc(it.s)}</span>${SPEAK(it.s)}</div>
      ${ua ? `<div class="uabox">${esc(it.su)}</div>` : ""}
      <div class="choices"><button class="opt yes" data-a="true">Cert${ua ? "<small>Правда</small>" : ""}</button><button class="opt no" data-a="false">Fals${ua ? "<small>Неправда</small>" : ""}</button></div>`;
  }
  // order
  if(!G.tiles) G.tiles = shuffle(it.steps.map((s,i) => ({s, i})));
  const left = G.tiles.filter(t => !G.got.includes(t.i));
  return `<p class="prompt">${esc(it.q)} <span class="ua">Toca en ordre.</span></p>
    ${ua ? `<div class="uabox">${esc(it.qu)} Торкайся по порядку.</div>` : ""}
    <ol class="order-done">
      ${G.got.map(i => `<li><span>${esc(it.steps[i][0])}${ua ? `<small>${esc(it.steps[i][1])}</small>` : ""}</span></li>`).join("")}
      ${G.answered ? "" : `<li class="slot"><span>?</span></li>`}
    </ol>
    ${left.length ? `<div class="tiles">${left.map(t => `<button class="tile ${G.shake === t.i ? "shake" : ""}" data-t="${t.i}">${esc(t.s[0])}${ua ? `<small>${esc(t.s[1])}</small>` : ""}</button>`).join("")}</div>` : ""}`;
}
function draw(fb){
  if(!G.opts) G.opts = optionsFor(G.current);
  const pct = Math.round(G.done / G.total * 100);
  const hint = !G.answered && !G.showUa ? `<div class="hintrow"><button class="hint" id="hint">Підказка українською</button></div>` : "";
  $screen.innerHTML = `
  <div class="card">
    <div class="topbar">
      <button class="ghost" id="back">← ${esc(G.l.t)}</button>
      <div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div>
      <span class="count">${G.done}/${G.total}</span>
    </div>
    ${body()}
    ${hint}
    ${fb || ""}
  </div>`;
  document.getElementById("back").onclick = () => lesson(G.si, G.li);
  const h = document.getElementById("hint"); if(h) h.onclick = () => { G.showUa = true; draw(); };
  if(G.r.type === "order"){
    if(!G.answered) $screen.querySelectorAll("[data-t]").forEach(b => b.onclick = () => tapTile(+b.dataset.t));
  } else if(!G.answered) $screen.querySelectorAll("[data-a]").forEach(b => b.onclick = () => answer(b.dataset.a));
  else markButtons();
  const n = document.getElementById("next"); if(n){ n.onclick = next; n.focus(); }
}
function markButtons(){
  const k = correctKey(G.current);
  $screen.querySelectorAll("[data-a]").forEach(b => {
    b.disabled = true;
    if(b.dataset.a === k) b.classList.add("right");
    else if(b.dataset.a === G.picked) b.classList.add("wrong");
    else b.classList.add("fade");
  });
}
function settle(ok){
  G.answered = true;
  G.queue.shift();
  if(ok) G.done++;
  else { G.missed.add(label(G.current)); G.queue.splice(Math.min(3, G.queue.length), 0, G.current); }
}
function nextBtn(){ return `<button class="next" id="next">${G.queue.length ? "Següent →" : "Veure el resultat"}</button>`; }
function tapTile(i){
  const it = G.current;
  if(i === G.got.length){ G.got.push(i); G.shake = null; }
  else { G.mistakes++; G.slipped = true; G.shake = i; }
  if(G.got.length === it.steps.length){
    settle(!G.slipped);
    const fb = `<div class="feedback ${G.slipped ? "no" : "ok"}"><b class="h">${G.slipped ? "Ja està! Tornarà a sortir." : "Perfecte!"}</b><span>${it.steps.map(s => esc(s[0])).join(" → ")}</span><span class="ua">${it.steps.map(s => esc(s[1])).join(" → ")}</span></div>${nextBtn()}`;
    return draw(fb);
  }
  draw();
}
function answer(a){
  const it = G.current, r = G.r, ok = a === correctKey(it);
  G.picked = a;
  if(!ok) G.mistakes++;
  settle(ok);
  const head = ok ? "Molt bé!" : "Gairebé!";
  let ca, ua;
  if(r.type === "tf"){
    ca = `És <b>${it.a ? "cert" : "fals"}</b>. ${esc(it.e)}`; ua = `${it.a ? "Правда" : "Неправда"}. ${esc(it.eu)}`;
  } else if(r.type === "pick"){
    ca = `<b>${esc(it.a)}</b>: ${esc(it.q)}${it.f ? " " + esc(it.f[0]) : ""}`; ua = `${esc(it.au)}: ${esc(it.qu)}${it.f ? " " + esc(it.f[1]) : ""}`;
  } else if(r.type === "sort"){
    const c = r.cats.find(x => x.k === it.c);
    ca = `<b>${esc(it.ca)}</b> → <b>${r.catWord ? r.catWord[0] + " " : ""}${c.ca.toLowerCase()}</b>. ${esc(it.f ? it.f[0] : "")}`;
    ua = `${esc(it.ua)} → ${c.ua.toLowerCase()}${r.catWord ? " " + r.catWord[1] : ""}. ${esc(it.f ? it.f[1] : "")}`;
  } else {
    ca = `${r.numbered ? `El número ${it.n} és ` : "És "}<b>${esc(it.ca)}</b>. ${esc(it.f ? it.f[0] : "")}`;
    ua = `${r.numbered ? `Номер ${it.n}: ` : ""}${esc(it.ua)}. ${esc(it.f ? it.f[1] : "")}`;
  }
  draw(`<div class="feedback ${ok ? "ok" : "no"}"><b class="h">${head}</b><span>${ca}</span><span class="ua">${ua}</span></div>${nextBtn()}`);
}
function result(){
  const m = G.mistakes, t = G.total;
  const stars = m <= 1 ? 3 : (m <= Math.ceil(t * 0.25) ? 2 : 1);
  const k = key(G.l, G.r);
  if(stars > (best[k] || 0)){ best[k] = stars; store.set("apren-best", best); }
  const msg = stars === 3 ? ["Fantàstic!", "Чудово!"] : stars === 2 ? ["Molt bé!", "Дуже добре!"] : ["Bon començament!", "Гарний початок!"];
  const nr = G.l.rounds[G.ri + 1];
  $screen.innerHTML = `
  <div class="card result">
    ${starsHtml(stars)}
    <h2>${msg[0]}</h2>
    <p class="ua" style="margin:-8px 0 0">${msg[1]}</p>
    <p class="lead">${esc(G.r.t)}: ${t} encerts, ${m} ${m === 1 ? "error" : "errors"}.</p>
    ${G.missed.size ? `<div><p class="prompt" style="margin-bottom:8px">Repassa · Повтори:</p><div class="chips">${[...G.missed].map(x => `<span class="chip">${esc(x)}</span>`).join("")}</div></div>` : `<p class="ua" style="margin:0">Cap error. Без жодної помилки.</p>`}
    <div class="row">
      ${nr ? `<button class="next" id="go">Següent joc: ${esc(nr.t)}</button>` : ""}
      <button class="ghost" id="again">Torna a jugar</button>
      <button class="ghost" id="up">${esc(G.l.t)}</button>
    </div>
  </div>`;
  document.getElementById("again").onclick = () => start(G.si, G.li, G.ri);
  document.getElementById("up").onclick = () => lesson(G.si, G.li);
  const go = document.getElementById("go"); if(go) go.onclick = () => start(G.si, G.li, G.ri + 1);
}
home();
</script>
</body>
</html>
