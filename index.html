<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El joc dels rius</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: one centred play column like a school worksheet card; the map and the three vessant colours from the class map carry the identity. */
:root{
  --bg:#EEF4F8; --surface:#FFFFFF; --ink:#15314A; --muted:#566C80; --line:#D3DFE8;
  --river:#1D63C4; --good:#23804E; --good-bg:#DDF3E6; --bad:#B9440F; --bad-bg:#FCE6DA;
  --cant:#F7C9CE; --cant-ink:#6E1A26; --atl:#D2E8C5; --atl-ink:#1F5219; --med:#F8EDA6; --med-ink:#5E4900;
  --map-bg:#EEF5FA; --badge:#1B3A57; --btn:#1D63C4; --btn-ink:#FFFFFF;
  --f-display:"Rubik", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1B27; --surface:#162736; --ink:#E5EEF6; --muted:#9BB0C3; --line:#2A4054;
  --river:#7AB0F7; --good:#62CC90; --good-bg:#173A29; --bad:#F39468; --bad-bg:#43251A;
  --cant:#59303A; --cant-ink:#FFDCE0; --atl:#2D4A2B; --atl-ink:#DAF3CF; --med:#544A1E; --med-ink:#FFF0B0;
  --badge:#9CC3EA; --btn:#2F72CC; --btn-ink:#FFFFFF; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1B27; --surface:#162736; --ink:#E5EEF6; --muted:#9BB0C3; --line:#2A4054;
  --river:#7AB0F7; --good:#62CC90; --good-bg:#173A29; --bad:#F39468; --bad-bg:#43251A;
  --cant:#59303A; --cant-ink:#FFDCE0; --atl:#2D4A2B; --atl-ink:#DAF3CF; --med:#544A1E; --med-ink:#FFF0B0;
  --badge:#9CC3EA; --btn:#2F72CC; --btn-ink:#FFFFFF; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.app{max-width:640px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--river);outline-offset:2px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
h1{font-family:var(--f-display);font-weight:700;font-size:1.6rem;line-height:1.1;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.92rem;margin:2px 0 0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px}
.lead{font-size:1.05rem;margin:0}
.ua{color:var(--muted);font-size:.92rem}

.rounds{display:grid;gap:12px}
.round{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;text-align:left;
  background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;transition:border-color .15s, transform .15s}
.round:hover{border-color:var(--river)}
.round:active{transform:scale(.99)}
.round .num{width:40px;height:40px;border-radius:50%;background:var(--badge);color:var(--surface);
  display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.round .t{font-family:var(--f-display);font-weight:700;font-size:1.12rem;display:block}
.round .d{color:var(--muted);font-size:.9rem;display:block}
.stars{display:flex;gap:2px;flex:none}
.stars svg{width:20px;height:20px}
.star-on{fill:#E8A817}
.star-off{fill:var(--line)}

.topbar{display:flex;align-items:center;gap:12px}
.ghost{background:none;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.92rem}
.ghost:hover{border-color:var(--river)}
.progress{flex:1;height:12px;background:var(--line);border-radius:999px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--river);border-radius:999px;transition:width .3s}
.count{font-variant-numeric:tabular-nums;font-weight:800;font-size:.95rem;color:var(--muted);min-width:3.5em;text-align:right}

.prompt{font-family:var(--f-display);font-weight:500;font-size:1.05rem;color:var(--muted);margin:0}
.big{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;text-align:center}
.big .word{font-family:var(--f-display);font-weight:700;font-size:2.4rem;line-height:1.1;color:var(--river)}
.big .def{font-size:1.25rem;font-weight:600;line-height:1.35;max-width:30ch}
.speak{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);display:grid;place-items:center;flex:none}
.speak svg{width:20px;height:20px;fill:var(--river)}
.hintrow{display:flex;justify-content:center}
.hint{background:none;border:none;color:var(--river);font-weight:700;font-size:.92rem;text-decoration:underline;text-underline-offset:3px;padding:4px}
.uabox{background:var(--bg);border-radius:12px;padding:10px 14px;text-align:center;color:var(--ink);font-size:.98rem}

.choices{display:grid;gap:10px}
.choices.v3{grid-template-columns:repeat(3,1fr)}
.choices.v4{grid-template-columns:repeat(2,1fr)}
.opt{border:2px solid transparent;border-radius:14px;padding:16px 10px;font-weight:800;font-size:1.05rem;min-height:64px;
  background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .12s}
.opt:hover:not(:disabled){transform:translateY(-2px)}
.opt:disabled{cursor:default}
.opt small{font-weight:600;font-size:.78rem;opacity:.85}
.opt.cant{background:var(--cant);color:var(--cant-ink)}
.opt.atl{background:var(--atl);color:var(--atl-ink)}
.opt.med{background:var(--med);color:var(--med-ink)}
.opt.right{border-color:var(--good);box-shadow:0 0 0 3px var(--good-bg)}
.opt.wrong{border-color:var(--bad);opacity:.75}
.opt.fade{opacity:.45}

.map{position:relative;background:var(--map-bg);border-radius:14px;overflow:hidden;max-width:100%}
.map img{display:block;width:100%;height:auto}
.marker{position:absolute;width:13%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  border:4px solid #E4572E;box-shadow:0 0 0 4px rgba(255,255,255,.8);pointer-events:none}
.marker::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:4px solid #E4572E;animation:pulse 1.4s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.9}to{transform:scale(1.7);opacity:0}}
.tag{position:absolute;transform:translate(-50%,-150%);background:#15314A;color:#fff;font-weight:800;font-size:.9rem;
  padding:4px 10px;border-radius:999px;white-space:nowrap;pointer-events:none}

.feedback{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.feedback.ok{background:var(--good-bg)}
.feedback.no{background:var(--bad-bg)}
.feedback b{font-family:var(--f-display);font-size:1.1rem}
.feedback.ok b{color:var(--good)}
.feedback.no b{color:var(--bad)}
.next{align-self:stretch;background:var(--btn);color:var(--btn-ink);border:none;border-radius:14px;padding:14px;font-weight:800;font-size:1.05rem}

.result{align-items:center;text-align:center}
.result .stars svg{width:52px;height:52px}
.result .stars svg{animation:pop .4s ease-out both}
.result .stars svg:nth-child(2){animation-delay:.15s}
.result .stars svg:nth-child(3){animation-delay:.3s}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.result h2{font-family:var(--f-display);font-size:1.6rem;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.92rem}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
.row .next{flex:1 1 180px}
.row .ghost{flex:1 1 140px;padding:13px}
.foot{color:var(--muted);font-size:.85rem;text-align:center;margin:0}

.overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.map.drawable{cursor:crosshair;touch-action:manipulation}
.editlink{border-style:dashed}
.editlink .num{background:var(--bg);color:var(--river);border:2px dashed var(--river)}

.form{display:grid;gap:12px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.legend{font-weight:800;font-size:.9rem}
.field label small,.legend small{font-weight:600;color:var(--muted)}
.field input,.field textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%;box-sizing:border-box}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--river)}
.field textarea{font-family:ui-monospace,Consolas,monospace;font-size:.8rem;min-height:90px;resize:vertical}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg .opt{min-height:48px;padding:10px 6px;font-size:.95rem}
.seg .opt[aria-pressed="true"]{border-color:var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools .ghost{padding:8px 14px}
.tools .pts{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:.9rem;margin:0}
.err{color:var(--bad);font-weight:700;font-size:.92rem;margin:0}
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.list li{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:8px 10px}
.list .dot{width:28px;height:28px;border-radius:50%;background:var(--badge);color:var(--surface);display:grid;place-items:center;font-weight:800;font-size:.85rem;flex:none}
.list .nm{flex:1;min-width:0;font-weight:700}
.list .nm small{display:block;font-weight:600;color:var(--muted)}
.list .ghost{padding:5px 10px;font-size:.85rem}
.chips button.chip{cursor:pointer}
.chips button.chip:hover{border-color:var(--river)}
h3{font-family:var(--f-display);font-size:1.1rem;margin:0}

@media (max-width:420px){
  .form .two{grid-template-columns:1fr}
  .choices.v3{grid-template-columns:1fr}
  .big .word{font-size:2rem}
  h1{font-size:1.35rem}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

      <div>
        <h1>El joc dels rius</h1>
        <p class="sub">Els rius de la península Ibèrica · Річки Піренейського півострова</p>
      </div>
    </div>
  </header>
  <main id="screen" aria-live="polite"></main>
</div>

/* ---------- rivers: built-in + added (file block, then this browser) ---------- */
function readFileExtras(){
  try{ const a = JSON.parse(document.getElementById("rius-extra").textContent || "[]"); return Array.isArray(a) ? a : []; }catch(e){ return []; }
}
const FILE_EXTRAS = readFileExtras();
let localExtras = store.get("rius-extra") || [];
const norm = s => String(s||"").trim().toLowerCase();
function cleanExtra(e){
  if(!e || !e.ca || !V[e.v]) return null;
  const line = Array.isArray(e.line) ? e.line.filter(p => Array.isArray(p) && p.length === 2).map(p => [Math.round(+p[0]), Math.round(+p[1])]) : [];
  return {ca:String(e.ca).trim(), ua:String(e.ua||e.ca).trim(), v:e.v, n:+e.n||0, x:+e.x||0, y:+e.y||0, line,
          f:(Array.isArray(e.f) && e.f[0]) ? [String(e.f[0]), String(e.f[1]||"")] : undefined};
}
let RIVERS = [];
function buildRivers(){
  const byName = new Map(BASE.map(r => [norm(r.ca), {...r}]));
  for(const raw of [...FILE_EXTRAS, ...localExtras]){
    const e = cleanExtra(raw); if(!e) continue;
    const k = norm(e.ca), old = byName.get(k);
    if(old && old.base && old.n && !old.added) continue;          // the 16 printed rivers stay as printed
    byName.set(k, {...(old||{}), ...e, f: e.f || (old && old.f), added:true, base: !!(old && old.base)});
  }
  RIVERS = [...byName.values()];
}
buildRivers();
function nextNumber(){ return Math.max(16, ...RIVERS.map(r => r.n || 0)) + 1; }

/* SVG layer drawn over the class map: added river lines and their number badges */
function overlay(extra){
  const rs = RIVERS.filter(r => r.added && r.n);
  const lines = rs.filter(r => r.line.length > 1).map(r => `<polyline points="${r.line.map(p => p.join(",")).join(" ")}" fill="none" stroke="#2468D2" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>`).join("");
  const badges = rs.map(r => `<g><circle cx="${r.x}" cy="${r.y}" r="14" fill="#1B3A57" stroke="#fff" stroke-width="2.5"/><text x="${r.x}" y="${r.y + 5}" text-anchor="middle" font-family="Nunito, sans-serif" font-weight="800" font-size="14" fill="#fff">${r.n}</text></g>`).join("");
  return `<svg class="overlay" viewBox="0 0 ${MAP_W} ${MAP_H}" aria-hidden="true">${lines}${badges}${extra||""}</svg>`;
}
function mapHtml(inner, cls){
  return `<div class="map ${cls||""}"><img src="${MAP_SRC}" alt="Mapa dels rius de la península Ibèrica amb números" draggable="false">${overlay()}${inner||""}</div>`;
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function say(text){
  if(!canSpeak) return;
  try{
    const u = new SpeechSynthesisUtterance(text);
    const voices = speechSynthesis.getVoices();
    const v = voices.find(x => /^ca/i.test(x.lang)) || voices.find(x => /^es/i.test(x.lang));
    u.lang = v ? v.lang : "ca-ES"; if(v) u.voice = v; u.rate = 0.85;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

let E = null;
const elR = name => /^[aeiouàèéíïòóúüh]/i.test(name) ? `l’${name}` : `el ${name}`;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function blankDraft(){ return {ca:"", ua:"", v:"", f0:"", f1:"", line:[], editing:null}; }
function exportCode(){
  const list = RIVERS.filter(r => r.added).map(r => {
    const o = {ca:r.ca, ua:r.ua, v:r.v, n:r.n, x:r.x, y:r.y, line:r.line};
    if(r.f && r.f[0]) o.f = r.f;
    return o;
  });
  return JSON.stringify(list);
}
function saveLocal(){
  localExtras = RIVERS.filter(r => r.added).map(r => ({ca:r.ca, ua:r.ua, v:r.v, n:r.n, x:r.x, y:r.y, line:r.line, f:r.f}));

  $screen.innerHTML = `

    <div class="form">

        <div class="field"><label for="f-ua">Назва українською <small>(opcional)</small></label><input id="f-ua" autocomplete="off" value="${esc(E.ua)}" placeholder="напр. Тер"></div>

  </div>`;

  const keep = () => { E.ca = val("f-ca"); E.ua = val("f-ua"); E.f0 = val("f-f0"); E.f1 = val("f-f1"); };

    const base = BASE.find(r => r.ca === name); if(base) RIVERS.push({...base});

    editor({text: fileHas ? `${name} s’ha tret d’aquí, però encara és dins d’index.html. Copia el codi nou i enganxa’l al fitxer.` : `${name} s’ha tret del mapa.`});

  };
}
function saveDraft(){
  const ca = E.ca.replace(/\s+/g, " ").trim();
  if(!ca) return editor({err:true, text:"Escriu el nom del riu en català."});
  if(!E.v) return editor({err:true, text:"Tria el vessant del riu."});
  if(!E.line.length) return editor({err:true, text:"Toca el mapa per posar el riu."});
  const clash = RIVERS.find(r => norm(r.ca) === norm(ca) && r.ca !== E.editing && (r.added || r.n));
  if(clash) return editor({err:true, text:`${cap(elR(clash.ca))} ja és al mapa amb el número ${clash.n}.`});
  const old = E.editing ? RIVERS.find(r => r.ca === E.editing) : null;
  const baseOff = BASE.find(r => norm(r.ca) === norm(ca) && !r.n);
  const n = old ? old.n : nextNumber();
  const mid = E.line[Math.floor((E.line.length - 1) / 2)];
  const rec = {ca, ua: E.ua || (baseOff ? baseOff.ua : ca), v:E.v, n, x:mid[0], y:mid[1], line:E.line.map(p => p.slice()),
               f: E.f0 ? [E.f0, E.f1] : (baseOff ? baseOff.f : undefined), added:true, base: !!baseOff};
  RIVERS = RIVERS.filter(r => r !== old && !(norm(r.ca) === norm(ca)));
  RIVERS.push(rec);
  saveLocal();
  E = blankDraft();
  editor({text:`Fet! ${cap(elR(ca))} ja és al mapa amb el número ${n}. Sortirà al joc.`});
}

/* ---------- game ---------- */
let G = null;
function start(i){
  const r = ROUNDS[i];
  const items = shuffle(r.items());
  G = {i, r, queue: items, total: items.length, done: 0, mistakes: 0, missed: new Set(), answered: false, showUa: false, current: null};
  next();
}
function next(){
  if(!G.queue.length) return result();
  G.current = G.queue[0]; G.answered = false; G.showUa = false; G.opts = null;
  draw();
}
function optionsFor(item){
  if(G.r.id === "sort") return ["cant","atl","med"];
  if(G.r.id === "map"){
    const pool = shuffle(RIVERS.filter(r => r.n && r !== item)).slice(0,3);
    return shuffle([item, ...pool]);
  }
  const pool = shuffle(WORDS.filter(w => w !== item)).slice(0,3);
  return shuffle([item, ...pool]);
}
function draw(fb){
  const it = G.current, id = G.r.id;
  if(!G.opts) G.opts = optionsFor(it);
  const pct = Math.round(G.done / G.total * 100);
  let body = "";
  if(id === "sort"){
    body = `
      <p class="prompt">A quin vessant va aquest riu?</p>
      <div class="big"><span class="word">${it.ca}</span>${SPEAK(it.ca)}</div>
      ${G.showUa ? `<div class="uabox">До якого басейну стоку належить річка <b>${it.ua}</b>?</div>` : ""}
      <div class="choices v3">${G.opts.map(v => `<button class="opt ${v}" data-a="${v}">${V[v].ca}${G.showUa?`<small>${V[v].ua}</small>`:""}</button>`).join("")}</div>`;
  } else if(id === "map"){
    const lx = (it.x/MAP_W*100).toFixed(2), ly = (it.y/MAP_H*100).toFixed(2);
    body = `
      <p class="prompt">Quin riu és el número <b>${it.n}</b>?</p>
      ${mapHtml(`<span class="marker" style="left:${lx}%;top:${ly}%"></span>
        ${G.answered ? `<span class="tag" style="left:${lx}%;top:${ly}%">${it.n} · ${esc(it.ca)}</span>` : ""}`)}
      ${G.showUa ? `<div class="uabox">Яка річка має номер <b>${it.n}</b>?</div>` : ""}
      <div class="choices v4">${G.opts.map(o => `<button class="opt" data-a="${esc(o.ca)}">${o.ca}${G.showUa?`<small>${o.ua}</small>`:""}</button>`).join("")}</div>`;
  } else {
    body = `
      <p class="prompt">Quina paraula és?</p>
      <div class="big"><span class="def">${it.def}</span>${SPEAK(it.def)}</div>
      ${G.showUa ? `<div class="uabox">${it.defUa}</div>` : ""}
      <div class="choices v4">${G.opts.map(o => `<button class="opt" data-a="${esc(o.ca)}">${o.ca}${G.showUa?`<small>${o.ua}</small>`:""}</button>`).join("")}</div>`;
  }
  const hint = !G.answered && !G.showUa ? `<div class="hintrow"><button class="hint" id="hint">Підказка українською</button></div>` : "";
  $screen.innerHTML = `
  <div class="card">
    <div class="topbar">
      <button class="ghost" id="back">← Menú</button>
      <div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div>
      <span class="count">${G.done}/${G.total}</span>
    </div>
    ${body}
    ${hint}
    ${fb || ""}
  </div>`;
  document.getElementById("back").onclick = menu;
  const h = document.getElementById("hint"); if(h) h.onclick = () => { G.showUa = true; draw(); };
  if(!G.answered) $screen.querySelectorAll("[data-a]").forEach(b => b.onclick = () => answer(b.dataset.a));
  else markButtons();
  const n = document.getElementById("next"); if(n) n.focus();
}
function correctKey(it){ return G.r.id === "sort" ? it.v : it.ca; }
function markButtons(){
  const key = correctKey(G.current);
  $screen.querySelectorAll("[data-a]").forEach(b => {
    b.disabled = true;
    if(b.dataset.a === key) b.classList.add("right");
    else if(b.dataset.a === G.picked) b.classList.add("wrong");
    else b.classList.add("fade");
  });
}
function answer(a){
  const it = G.current, ok = a === correctKey(it);
  G.answered = true; G.picked = a;
  G.queue.shift();
  if(ok){ G.done++; }
  else { G.mistakes++; G.missed.add(it.ca); G.queue.splice(Math.min(3, G.queue.length), 0, it); }
  let head, ca, ua;
  if(G.r.id === "words"){
    head = ok ? "Molt bé!" : "Gairebé!";
    ca = `<b style="font-size:1rem">${it.ca}</b>: ${it.def}`;
    ua = `${it.ua}: ${it.defUa}`;
  } else {
    const fact = it.f || null;
    head = ok ? "Molt bé!" : "Gairebé!";
    const where = G.r.id === "map" ? `El número ${it.n} és el <b>${it.ca}</b>.` : `<b>${it.ca}</b> → vessant <b>${V[it.v].ca.toLowerCase()}</b>.`;
    const whereUa = G.r.id === "map" ? `Номер ${it.n}: ${it.ua}.` : `${it.ua} → ${V[it.v].ua.toLowerCase()} басейн.`;
    const extra = [];
    const extraUa = [];
    if(G.r.id === "map"){ extra.push(`Vessant ${V[it.v].ca.toLowerCase()}.`); extraUa.push(`${V[it.v].ua} басейн.`); }
    extra.push(fact ? fact[0] : V[it.v].sea); extraUa.push(fact ? fact[1] : V[it.v].seaUa);
    if(!it.n){ extra.push(NOMAP[0]); extraUa.push(NOMAP[1]); }
    ca = `${where} ${extra.join(" ")}`;
    ua = `${whereUa} ${extraUa.join(" ")}`;
  }
  const last = !G.queue.length;
  const fb = `
    <div class="feedback ${ok?"ok":"no"}"><b>${head}</b><span>${ca}</span><span class="ua">${ua}</span></div>
    <button class="next" id="next">${last ? "Veure el resultat" : "Següent →"}</button>`;
  draw(fb);
  document.getElementById("next").onclick = next;
}
function result(){
  const m = G.mistakes, t = G.total;
  const stars = m <= 1 ? 3 : (m <= Math.ceil(t * 0.25) ? 2 : 1);
  const prev = best[G.r.id] || 0;
  if(stars > prev){ best[G.r.id] = stars; store.set("rius-best", best); }
  const msg = stars === 3 ? ["Fantàstic!", "Чудово!"] : stars === 2 ? ["Molt bé!", "Дуже добре!"] : ["Bon començament!", "Гарний початок!"];
  const nextRound = G.i < ROUNDS.length - 1 ? `<button class="next" id="go">Ronda ${G.i+2}: ${ROUNDS[G.i+1].t}</button>` : "";
  $screen.innerHTML = `
  <div class="card result">
    ${starsHtml(stars)}
    <h2>${msg[0]}</h2>
    <p class="ua" style="margin:-8px 0 0">${msg[1]}</p>
    <p class="lead">${G.r.t}: ${t} encerts, ${m} ${m===1?"error":"errors"}.</p>
    ${G.missed.size ? `<div><p class="prompt" style="margin-bottom:8px">Repassa aquests · Повтори ці:</p><div class="chips">${[...G.missed].map(x => `<span class="chip">${x}</span>`).join("")}</div></div>` : `<p class="ua" style="margin:0">Cap error. Без жодної помилки.</p>`}
    <div class="row">
      ${nextRound}
      <button class="ghost" id="again">Torna a jugar</button>
      <button class="ghost" id="home">Menú</button>
    </div>
  </div>`;
  document.getElementById("again").onclick = () => start(G.i);
  document.getElementById("home").onclick = menu;
  const go = document.getElementById("go"); if(go) go.onclick = () => start(G.i + 1);
}
menu();
</script>
